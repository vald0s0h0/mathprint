# Publie les images Docker MathPrint sur GHCR à chaque tag "vX.Y.Z"
# (version jalonnée, épinglable via MATHPRINT_VERSION). Le déploiement
# continu du quotidien passe par deploy.yml (push sur main → "latest") ;
# le NAS se met à jour via la tâche planifiée DSM (scripts/nas-update.sh).
name: Release Docker images

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - run: cd backend && python -m pytest tests/ -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd frontend && npm ci && npx tsc -b

  build-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MathPrint
        uses: actions/checkout@v4

      - name: Version (sans le "v" initial)
        id: ver
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%MZ)" >> "$GITHUB_OUTPUT"

      # cf. deploy.yml : les prompts LLM (racine du dépôt) doivent entrer dans
      # le contexte de build de l'API, sinon l'image ne peut fabriquer aucun
      # exercice (PromptNotFound au premier appel LLM).
      - name: Embarquer les prompts dans le contexte de build
        run: cp -R prompts backend/app/data/prompts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push — api
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          build-args: |
            GIT_SHA=${{ steps.ver.outputs.sha }}
            BUILD_TIME=${{ steps.ver.outputs.time }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/mathprint-api:${{ steps.ver.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/mathprint-api:latest

      - name: Build & push — web
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            GIT_SHA=${{ steps.ver.outputs.sha }}
            BUILD_TIME=${{ steps.ver.outputs.time }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/mathprint-web:${{ steps.ver.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/mathprint-web:latest

      - name: Créer la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
