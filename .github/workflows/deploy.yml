# Déploiement continu : CHAQUE push sur main publie les images "latest" sur
# GHCR (après tests). Aucune action dev supplémentaire — le NAS se met à jour
# tout seul via la tâche planifiée DSM (scripts/nas-update.sh, voir
# DEPLOIEMENT_NAS.md §7). Les tags "sha-XXXXXXX" permettent un retour arrière
# précis (MATHPRINT_VERSION=sha-XXXXXXX dans .env).
#
# Chaque image n'est reconstruite que si son code a changé (filtre par
# chemins) ; le cache GitHub Actions rend les rebuilds rapides. Les images
# NON reconstruites sont quand même ré-étiquetées "sha-XXXXXXX" (job "retag")
# : le `docker compose pull` du NAS porte sur tout le projet, donc un seul
# manifeste manquant ferait échouer la mise à jour ENTIÈRE.
name: Deploy latest images

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # relance manuelle (reconstruit tout)

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-latest
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'backend/**'
              # les prompts LLM sont embarqués dans l'image (cf. job api) :
              # les éditer doit donc reconstruire l'API, sinon la modification
              # ne quitte jamais la machine de développement
              - 'prompts/**'
            web:
              - 'frontend/**'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - run: cd backend && python -m pytest tests/ -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd frontend && npm ci && npx tsc -b

  meta:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.v.outputs.sha }}
      time: ${{ steps.v.outputs.time }}
    steps:
      - id: v
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%MZ)" >> "$GITHUB_OUTPUT"

  api:
    needs: [changes, test, meta]
    if: needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Les prompts LLM vivent à la RACINE du dépôt (édition à chaud en dev),
      # hors du contexte de build `./backend`. On les y recopie pour qu'ils
      # partent dans l'image : sans eux, une instance déployée ne peut fabriquer
      # aucun exercice (PromptNotFound au premier appel LLM). Le dossier
      # éditable reste prioritaire à l'exécution, cf. services/prompts.py.
      - name: Embarquer les prompts dans le contexte de build
        run: cp -R prompts backend/app/data/prompts
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          build-args: |
            GIT_SHA=${{ needs.meta.outputs.sha }}
            BUILD_TIME=${{ needs.meta.outputs.time }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/mathprint-api:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/mathprint-api:sha-${{ needs.meta.outputs.sha }}

  web:
    needs: [changes, test, meta]
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            GIT_SHA=${{ needs.meta.outputs.sha }}
            BUILD_TIME=${{ needs.meta.outputs.time }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/mathprint-web:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/mathprint-web:sha-${{ needs.meta.outputs.sha }}

  # Recopie le manifeste "latest" sous le tag sha-XXXXXXX pour les images que
  # les filtres de chemins n'ont pas reconstruites, afin que les DEUX images
  # répondent toujours au même sha (retour arrière du NAS, §7 du guide NAS).
  # `imagetools create` travaille côté registre : aucun build, aucun pull.
  retag:
    needs: [test, meta, api, web]
    if: always() && needs.test.result == 'success' && needs.meta.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Étiqueter sha-XXXXXXX les images non reconstruites
        env:
          SHA: ${{ needs.meta.outputs.sha }}
          API: ${{ needs.api.result }}
          WEB: ${{ needs.web.result }}
        run: |
          set -euo pipefail
          base="${REGISTRY}/${IMAGE_OWNER}"
          for svc in api web; do
            case "$svc" in
              api) result="$API" ;;
              web) result="$WEB" ;;
            esac
            if [ "$result" != "skipped" ]; then
              echo "$svc : reconstruite ($result), déjà étiquetée sha-$SHA"
              continue
            fi
            echo "$svc : inchangée, latest -> sha-$SHA"
            docker buildx imagetools create \
              --tag "$base/mathprint-$svc:sha-$SHA" \
              "$base/mathprint-$svc:latest"
          done
